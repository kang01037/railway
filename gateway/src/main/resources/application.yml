server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      # demo 闃舵閰嶇疆涓績鍏抽棴锛岄伩鍏嶅惎鍔ㄥ繀椤昏繛 Nacos
      config:
        enabled: false
    gateway:
      # 涓嶅紑 locator锛堥伩鍏嶆寜 service-id 鑷姩寤鸿矾鐢憋級锛屽彧璧版墜鍐?routes
      discovery:
        locator:
          enabled: false
      routes:
        - id: user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: train-stock
          uri: lb://service-train-stock
          predicates:
            - Path=/api/train/**
          filters:
            - StripPrefix=2
        - id: ticket
          uri: lb://service-ticket
          predicates:
            - Path=/api/ticket/**
          filters:
            - StripPrefix=2
        - id: order
          uri: lb://service-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: payment
          uri: lb://service-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=2
        - id: search
          uri: lb://service-search
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2
        - id: notification
          uri: lb://service-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

# 缃戝叧閴存潈鐧藉悕鍗曪紙Ant 椋庢牸锛?gateway:
  public-paths:
    - /api/user/auth/login
    - /api/user/auth/register
    # 鏀粯鍥炶皟锛堢涓夋柟 鈫?鎴戞柟锛?    - /api/payment/callback/**

# JWT 閰嶇疆锛堝繀椤讳笌 service-user 涓€鑷达紝鍚﹀垯 token 鏍￠獙澶辫触锛?jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway

# 闆姳锛氱綉鍏宠嚜宸辩敤涓嶅埌锛屼絾寮曞叆 common 鍖呬細甯?SnowflakeIdWorker锛岃繖閲屾樉寮忕粰涓€?snowflake:
  worker-id: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: info
    com.railway: debug
