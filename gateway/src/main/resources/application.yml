server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      # demo 阶段配置中心关闭，避免启动必须连 Nacos
      config:
        enabled: false
    gateway:
      # 不开 locator（避免按 service-id 自动建路由），只走手写 routes
      discovery:
        locator:
          enabled: false
      routes:
        - id: user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: train-stock
          uri: lb://service-train-stock
          predicates:
            - Path=/api/train/**
          filters:
            - StripPrefix=2
        - id: ticket
          uri: lb://service-ticket
          predicates:
            - Path=/api/ticket/**
          filters:
            - StripPrefix=2
        - id: order
          uri: lb://service-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: payment
          uri: lb://service-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=2
        - id: search
          uri: lb://service-search
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2
        - id: notification
          uri: lb://service-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

# 网关鉴权白名单（Ant 风格）
gateway:
  public-paths:
    - /api/user/auth/login
    - /api/user/auth/register
    # 支付回调（第三方 → 我方）
    - /api/payment/callback/**

# JWT 配置（必须与 service-user 一致，否则 token 校验失败）
jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway

# 雪花：网关自己用不到，但引入 common 包会带 SnowflakeIdWorker，这里显式给个值
snowflake:
  worker-id: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: info
    com.railway: debug
