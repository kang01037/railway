server:
  port: 9105

spring:
  application:
    name: service-order
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/railway-real?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.railway.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# Feign：调下游 4 个服务，3s 连接 5s 读
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: basic
  # hystrix 不用了，依赖 FallbackFactory

jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway

# 雪花 worker-id: 5
snowflake:
  worker-id: 5

# 下单支付超时（默认 15 分钟）
order:
  pay-expire-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.railway: debug
    com.railway.order.feign: debug
