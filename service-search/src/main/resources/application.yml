server:
  port: 9200

spring:
  application:
    name: service-search
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
  elasticsearch:
    uris: http://127.0.0.1:9200
    connection-timeout: 2s
    socket-timeout: 5s

# Feign锛氳皟 service-train-stock 鎷垮骇浣嶄綑绁?feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

snowflake:
  worker-id: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.railway: debug
    org.springframework.data.elasticsearch.client: info
