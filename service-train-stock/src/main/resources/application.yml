server:
  port: 9102

spring:
  application:
    name: service-train-stock
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      # demo 阶段配置中心关闭
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/railway-real?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.railway.trainstock.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT（与 service-user 一致）
jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway

# 雪花 worker-id：本服务 2（gateway=0, user=1, train-stock=2, ticket=3, payment=4, order=5, notification=6, search=7）
snowflake:
  worker-id: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.railway: debug
    com.railway.trainstock.mapper: debug
