server:
  port: 9106

spring:
  application:
    name: service-notification
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/railway-real?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto            # 澶勭悊澶辫触杩?retry / DLQ
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.railway.notification.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 闆姳锛氶€氱煡鏈嶅姟鏃犻渶鐢熸垚 ID锛屽垪鍑烘潵婧愬惎鍔ㄦ椂涓嶆姤閿?snowflake:
  worker-id: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.railway: debug
    org.springframework.amqp: info
