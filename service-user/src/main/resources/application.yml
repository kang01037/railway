server:
  port: 9101
  servlet:
    context-path: /

spring:
  application:
    name: service-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
        # 涓嶄粠 Nacos 鎷夐厤缃紝鏈湴鐩撮厤锛坉emo 妯″紡锛夛紱鐢熶骇鏀逛负 import 鏂瑰紡
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/railway-real?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis锛堢敱 common 鎻愪緵 PageInterceptor / @MapperScan锛?mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.railway.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-fetch-size: 100

# PageHelper锛堢敱 pagehelper-spring-boot-starter 鑷姩瑁呴厤锛屽彲鍦ㄦ瑕嗙洊锛?pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT锛堢粦瀹氬埌 common 鐨?JwtUtil锛?jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway-real

# 闆姳锛堢粦瀹氬埌 common 鐨?SnowflakeIdWorker锛?# 澶氬疄渚嬮儴缃叉椂寤鸿鐢?K8s POD_NAME 娉ㄥ叆涓嶅悓 workerId
snowflake:
  worker-id: 1

# 鏃ュ織
logging:
  level:
    root: info
    com.railway: debug
    com.railway.user.mapper: debug   # 鎵撳嵃 SQL

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
