server:
  port: 9101
  servlet:
    context-path: /

spring:
  application:
    name: service-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
        # 不从 Nacos 拉配置，本地直配（demo 模式）；生产改为 import 方式
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/railway-real?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis（由 common 提供 PageInterceptor / @MapperScan）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.railway.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-fetch-size: 100

# PageHelper（由 pagehelper-spring-boot-starter 自动装配，可在此覆盖）
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT（绑定到 common 的 JwtUtil）
jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  expire-minutes: 120
  issuer: railway-real

# 雪花（绑定到 common 的 SnowflakeIdWorker）
# 多实例部署时建议用 K8s POD_NAME 注入不同 workerId
snowflake:
  worker-id: 1

# 日志
logging:
  level:
    root: info
    com.railway: debug
    com.railway.user.mapper: debug   # 打印 SQL

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
